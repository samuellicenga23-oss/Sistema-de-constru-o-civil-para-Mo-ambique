# Configuração Nginx para o SIGO — substituir SEU_DOMINIO pelo domínio real (ex: app.sigo.co.mz)
# antes de copiar para /etc/nginx/sites-available/sigo e activar com:
#   sudo ln -s /etc/nginx/sites-available/sigo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Depois correr `sudo certbot --nginx -d SEU_DOMINIO` — o certbot edita este ficheiro sozinho
# para acrescentar o bloco 443/SSL e o redirect 80->443, não é preciso escrever isso à mão aqui.

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    # Uploads de plantas (PDF) podem ser grandes — tem de bater certo com o limite do
    # @fastify/multipart em apps/api/src/index.ts (50 MB).
    client_max_body_size 60m;

    # Ficheiros estáticos do build do frontend (apps/web/dist)
    root /var/www/sigo/apps/web/dist;
    index index.html;

    # API — a app já regista as rotas com o prefixo /api ela própria, por isso o proxy
    # preserva o caminho tal e qual, sem reescrever nada.
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ficheiros carregados (plantas, logótipos) servidos pela própria API (@fastify/static)
    location /uploads/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA (React Router) — qualquer caminho que não seja um ficheiro real do build cai no
    # index.html, para o router do lado do cliente tratar da rota.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
